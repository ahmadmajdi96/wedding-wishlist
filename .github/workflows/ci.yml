name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Load build environment
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env.docker.example ]; then
            set -a
            . ./.env.docker.example
            set +a
          fi

          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required}"
          : "${VITE_SUPABASE_PROJECT_ID:?VITE_SUPABASE_PROJECT_ID is required}"

          {
            printf 'VITE_SUPABASE_URL=%s\n' "${VITE_SUPABASE_URL}"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "${VITE_SUPABASE_PUBLISHABLE_KEY}"
            printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "${VITE_SUPABASE_PROJECT_ID}"
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL:-${VITE_SUPABASE_URL}}"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY}}"
            printf 'SUPABASE_PROJECT_ID=%s\n' "${SUPABASE_PROJECT_ID:-${VITE_SUPABASE_PROJECT_ID}}"
            printf 'NITRO_PRESET=node-server\n'
          } >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --target runtime \
            --build-arg VITE_SUPABASE_URL="${VITE_SUPABASE_URL}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg VITE_SUPABASE_PROJECT_ID="${VITE_SUPABASE_PROJECT_ID}" \
            -t weddings-ci:${GITHUB_SHA} .
